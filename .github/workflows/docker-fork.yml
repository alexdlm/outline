name: Fork image

# Builds this fork's image and publishes it to the GitHub Container Registry of
# the repository owner, as ghcr.io/<owner>/outline. Upstream publishes to Docker
# Hub with docker.yml, which is skipped here by tagging releases "codecks-*"
# rather than "v*".
on:
  push:
    branches:
      - feat/codecks
    tags:
      - "codecks-*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository != 'outline/outline'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Prepare
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The base image holds the dependencies and the build, the final image
      # copies them onto a slim runtime, as upstream's docker-build.yml does.
      - name: Build and push base image
        id: base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ env.OWNER }}/outline-base,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ env.OWNER }}/outline
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ env.OWNER }}/outline-base@${{ steps.base.outputs.digest }}
